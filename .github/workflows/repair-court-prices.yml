name: Repair Current Court Auction Prices

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repair-court-prices.yml"

permissions:
  contents: write

concurrency:
  group: court-price-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: 기존 법원경매 가격 보정
        working-directory: court-auction-crawler
        run: node src/normalize-prices.mjs

      - name: 보정 데이터 저장
        run: |
          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add court-auction-crawler/data/court-auctions.json
          git diff --cached --quiet || git commit -m "data: repair court auction minimum prices"
          git push
