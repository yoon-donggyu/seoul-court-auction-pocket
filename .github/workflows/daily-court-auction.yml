name: Daily Seoul Court Auction Crawl

on:
  schedule:
    # 매일 한국시간 새벽 1시
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    paths:
      - "court-auction-crawler/src/**"
      - "court-auction-crawler/package.json"
      - "court-auction-crawler/package-lock.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: court-auction-daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: court-auction-crawler

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: court-auction-crawler/package-lock.json

      - name: 프로그램 설치
        run: npm ci

      - name: 수집용 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 서울 법원경매 수집
        run: npm run crawl

      - name: 최저매각가격 검증 및 보정
        run: node src/normalize-prices.mjs

      - name: 수집 결과 저장
        working-directory: .
        run: |
          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add court-auction-crawler/data/
          git diff --cached --quiet || git commit -m "data: update Seoul court auctions"
          git push

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 최신 수집 결과 불러오기
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 웹페이지 파일 준비
        uses: actions/upload-pages-artifact@v4
        with:
          path: court-auction-crawler

      - name: 웹페이지 배포
        id: deployment
        uses: actions/deploy-pages@v4
